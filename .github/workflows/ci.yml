name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Playwright suite is most of the run, so it is split across three runners
# that start alongside the quick checks instead of after them. `npm run verify`
# runs the same steps one after the other.
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # public/fonts must match what @fontsource ships, or the self-hosted
      # faces silently drift from the version in package-lock.json.
      - name: Fonts in sync
        run: npm run fonts:check

      - name: Lint and format
        run: npm run lint

      - name: Type-check
        run: npm run check

      # A missing portrait is reported as a warning. SITE_DOMAIN is
      # only required of a deployment build (SITE_STRICT=1, set by the
      # Dockerfile), so CI verifies against the placeholder.
      - name: Assets
        run: npm run assets:check

      - name: Content parity (EN/FR)
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (${{ matrix.name }})
    runs-on: ubuntu-latest
    # WebKit is about three times slower than Chromium on a Linux runner, and
    # `--shard` cuts the list in project order, so equal thirds left one shard
    # with nearly all of WebKit. Both Chromium projects share one runner and
    # WebKit gets two.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium
            id: chromium
            browser: chromium
            args: --project=desktop-chromium --project=mobile-chromium
          - name: WebKit 1/2
            id: webkit-1
            browser: webkit
            args: --project=desktop-webkit --shard=1/2
          - name: WebKit 2/2
            id: webkit-2
            browser: webkit
            args: --project=desktop-webkit --shard=2/2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Each shard builds and serves its own dist/ (see playwright.config.ts).
      - name: End-to-end, accessibility and budget
        run: npx playwright test ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.id }}
          path: blob-report/
          retention-days: 1

  # Folds the three shards back into one HTML report, and stands as the single
  # check that says whether the commit passed.
  verify:
    name: Verify
    if: ${{ !cancelled() }}
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Every job passed
        if: ${{ needs.quality.result != 'success' || needs.e2e.result != 'success' }}
        run: |
          echo "quality: ${{ needs.quality.result }}, e2e: ${{ needs.e2e.result }}"
          exit 1
