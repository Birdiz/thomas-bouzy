name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # public/fonts must match what @fontsource ships, or the self-hosted
      # faces silently drift from the version in package-lock.json.
      - name: Fonts in sync
        run: npm run fonts:check

      - name: Lint and format
        run: npm run lint

      - name: Type-check
        run: npm run check

      # Missing CV PDFs and portrait are reported as warnings. SITE_DOMAIN is
      # only required of a deployment build (SITE_STRICT=1, set by the
      # Dockerfile), so CI verifies against the placeholder.
      - name: Assets
        run: npm run assets:check

      - name: Content parity (EN/FR)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end, accessibility and budget
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
